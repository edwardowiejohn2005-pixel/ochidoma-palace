<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palace Admin Portal — Log in</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="login-screen">
  <div class="login-box">
    <h1>Palace Admin Portal</h1>
    <div class="sub">Sign in to manage heritage content, events, announcements, and royal decrees.</div>

    <div id="error-banner" class="error-banner hidden"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;" id="submit-btn">Log in</button>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  // Already logged in? Skip straight to the dashboard.
  if (getSession()) window.location.href = 'dashboard.html';

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBanner = document.getElementById('error-banner');
    const submitBtn = document.getElementById('submit-btn');
    errorBanner.classList.add('hidden');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    try {
      await login(document.getElementById('email').value, document.getElementById('password').value);
      window.location.href = 'dashboard.html';
    } catch (err) {
      errorBanner.textContent = err.message;
      errorBanner.classList.remove('hidden');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
